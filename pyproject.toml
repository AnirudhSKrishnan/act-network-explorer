[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "act_network"
version = "0.1.0"
description = "Maps the ACT electricity network from public OpenStreetMap data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopandas",
    "shapely>=2",
    "osmnx>=2",
    "networkx",
    "folium",
    "matplotlib",
    "pandapower",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
