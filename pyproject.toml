[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "act_network"
version = "0.1.0"
description = "Maps the ACT electricity network from public OpenStreetMap data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopandas",
    "shapely>=2",
    "osmnx>=2",
    "networkx",
    "folium",
    "matplotlib",
    "pandapower",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "basedpyright"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.basedpyright]
include = ["src", "tests"]
exclude = [".venv", "data", "outputs"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
# Scientific libraries do not all ship type stubs.
reportMissingTypeStubs = false
